<!doctype html>
<html lang="en">

<title>SPMJ — Suraj Prakash Mangilal Jewellers</title>
<meta name="theme-color" content="#250407">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap');
:root{--wine:#300508;--red:#6f1116;--gold:#d5a94a;--ivory:#f4ead7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160204;color:var(--ivory);font-family:Inter,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 20%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.72) 100%);z-index:2}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:3;opacity:.065;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");transform:rotate(8deg)}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none}.brand{position:absolute;top:28px;left:34px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.75}.edition{position:absolute;top:28px;right:34px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.58}
.intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(620px,90vw);transition:opacity .8s,transform 1s}.intro img{width:min(190px,38vw);height:auto;display:block;margin:0 auto 28px;mix-blend-mode:screen;filter:drop-shadow(0 0 20px rgba(213,169,74,.16))}.eyebrow{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#d7bf8b;margin-bottom:14px}.title{font:500 clamp(42px,7vw,92px)/.82 'Cormorant Garamond',serif;letter-spacing:.025em}.subtitle{margin:22px auto 32px;max-width:480px;color:#c8b9a2;font:italic 18px 'Cormorant Garamond',serif;line-height:1.35}.enter{pointer-events:auto;cursor:pointer;border:1px solid rgba(213,169,74,.55);background:rgba(33,4,7,.45);color:var(--ivory);padding:14px 28px;font-size:10px;letter-spacing:.38em;text-transform:uppercase;backdrop-filter:blur(8px);transition:.35s}.enter:hover{background:#d5a94a;color:#240407;box-shadow:0 0 35px rgba(213,169,74,.2)}
.hint{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#b8a98f;opacity:.7}.line{display:inline-block;width:42px;height:1px;background:var(--gold);vertical-align:middle;margin:0 12px;opacity:.6}
#loading{position:fixed;inset:0;background:#210306;z-index:10;display:grid;place-items:center;transition:opacity .8s}.loadmark{font:500 28px 'Cormorant Garamond',serif;letter-spacing:.25em;color:#d5a94a}
.opened .intro{opacity:0;transform:translate(-50%,-58%) scale(.96)}.opened .hint{opacity:0}
@media(max-width:700px){.brand{left:18px}.edition{right:18px}.intro img{width:145px}.subtitle{font-size:16px}.title{font-size:52px}}
</style>
</head>
<body>

<div id="stage"></div><div class="vignette"></div><div class="grain"></div>
<div class="ui">
<div class="brand">Suraj Prakash Mangilal Jewellers</div><div class="edition">Jodhpur · Rajasthan</div>

<div class="eyebrow">An invitation to enter</div>
<div class="title">The House of SPMJ</div>
<div class="subtitle">Where Rajasthan's heritage meets the quiet brilliance of fine jewellery.</div>
<button class="enter" id="enter">Enter the House</button>
</div>
<div class="hint"><span class="line"></span>Move to explore<span class="line"></span></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {gsap} from 'https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x190204);scene.fog=new THREE.FogExp2(0x190204,.055);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,2.8,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('#stage').appendChild(renderer.domElement);

const gold=new THREE.MeshStandardMaterial({color:0xb98a31,metalness:.86,roughness:.24});
const stone=new THREE.MeshStandardMaterial({color:0x8d5b3d,roughness:.78,metalness:.08});
const darkStone=new THREE.MeshStandardMaterial({color:0x321c19,roughness:.82});
const red=new THREE.MeshStandardMaterial({color:0x4b080d,roughness:.5,metalness:.1});

scene.add(new THREE.HemisphereLight(0xf6dfba,0x130103,1.3));
const key=new THREE.PointLight(0xd7a94c,80,28);key.position.set(0,7,7);scene.add(key);
const redLight=new THREE.PointLight(0x7a1118,45,25);redLight.position.set(0,4,-5);scene.add(redLight);

const world=new THREE.Group();scene.add(world);
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;world.add(m);return m}
function cyl(r,h,mat,x,y,z,seg=32){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;world.add(m);return m}

// Floor
const floor=box(30,.5,34,darkStone,0,-.35,-4);floor.receiveShadow=true;
const runner=box(4,.08,28,red,0,-.05,-4);
for(let z=-17;z<10;z+=2){const strip=box(3.2,.035,.025,gold,0,.01,z);strip.material.opacity=.22;strip.material.transparent=true}

// Rajasthani pillars
for(const x of [-6.2,6.2]){
  cyl(1.05,9,stone,x,4,-1);cyl(1.22,.38,gold,x,8.55,-1);cyl(1.25,.32,gold,x,-.05,-1);
  for(let y=1;y<8;y+=1.15)cyl(1.1,.09,gold,x,y,-1,24);
  const cap=cyl(1.65,.5,stone,x,9,-1);cap.scale.y=.6;
}
// Rear facade
box(15,9,.8,stone,0,4,-7);
const archOuter=new THREE.Mesh(new THREE.TorusGeometry(5.3,1.05,20,64,Math.PI),stone);archOuter.rotation.z=Math.PI;archOuter.position.set(0,3.8,-7.45);world.add(archOuter);
const archInner=new THREE.Mesh(new THREE.TorusGeometry(4.15,.34,16,64,Math.PI),gold);archInner.rotation.z=Math.PI;archInner.position.set(0,3.8,-7.9);world.add(archInner);

// Gate doors
const doors=new THREE.Group();world.add(doors);
function door(x,side){
 const g=new THREE.Group();g.position.set(x,4,-7.95);g.userData.side=side;
 const slab=box(4.05,7.4,.38,red,x,4,-7.95); // move mesh under group
 slab.position.set(0,0,0);g.add(slab);world.remove(slab);
 for(let y=-2.5;y<=2.5;y+=1.25)for(let xx=-1.4;xx<=1.4;xx+=1.4){const ring=new THREE.Mesh(new THREE.TorusGeometry(.48,.055,8,20),gold);ring.position.set(xx,y,.23);g.add(ring)}
 const hinge=cyl(.12,7,gold,0,0,.25,16);g.add(hinge);return g;
}
const left=door(-4.02,-1),right=door(4.02,1);doors.add(left,right);

// Door pulls
for(const x of [-.65,.65]){const h=cyl(.08,1.5,gold,x,4,-7.55,16);h.rotation.z=Math.PI/2;world.add(h)}

// Floating jewellery-like gold forms
const jewels=new THREE.Group();scene.add(jewels);
for(let i=0;i<13;i++){
 const r=.08+Math.random()*.18;const geo=new THREE.OctahedronGeometry(r,1);const m=new THREE.Mesh(geo,gold);
 m.position.set((Math.random()-.5)*15,1+Math.random()*8,-12-Math.random()*10);m.userData.baseY=m.position.y;m.userData.phase=Math.random()*6.28;jewels.add(m);
}
const dustGeo=new THREE.BufferGeometry();const pts=[];
for(let i=0;i<650;i++)pts.push((Math.random()-.5)*28,Math.random()*13-1,Math.random()*24-16);
dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xd8b15a,size:.025,transparent:true,opacity:.55}));scene.add(dust);

let mx=0,my=0,entered=false;
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
document.querySelector('#enter').addEventListener('click',()=>{
 if(entered)return;entered=true;document.body.classList.add('opened');
 gsap.to(left.rotation,{y:-1.12,duration:1.8,ease:'power3.inOut'});
 gsap.to(right.rotation,{y:1.12,duration:1.8,ease:'power3.inOut'});
 gsap.to(camera.position,{z:4.5,y:3.1,duration:2.8,delay:.25,ease:'power3.inOut'});
 gsap.to(camera.rotation,{y:0,duration:2.2,delay:.2});
 gsap.to(key,{intensity:125,duration:2});
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
function animate(t){
 requestAnimationFrame(animate);const time=t*.001;
 camera.position.x+=(mx*1.1-camera.position.x)*.025;
 camera.position.y+=((entered?3.1:2.8)+my*.5-camera.position.y)*.025;
 world.rotation.y+=((mx*.035)-world.rotation.y)*.03;
 jewels.children.forEach((m,i)=>{m.rotation.x=time*.25+i;m.rotation.y=time*.45+i*.2;m.position.y=m.userData.baseY+Math.sin(time*.7+m.userData.phase)*.12});
 dust.rotation.y=time*.008;
 renderer.render(scene,camera);
}
animate(0);
setTimeout(()=>gsap.to('#loading',{opacity:0,duration:.8,onComplete:()=>document.querySelector('#loading').remove()}),700);
</script>
</body></html>
